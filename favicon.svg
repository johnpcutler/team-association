<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Network nodes representing organization -->
  <circle cx="30" cy="35" r="4" fill="white" opacity="0.9"/>
  <circle cx="50" cy="30" r="4" fill="white" opacity="0.9"/>
  <circle cx="70" cy="35" r="4" fill="white" opacity="0.9"/>
  <circle cx="35" cy="50" r="4" fill="white" opacity="0.9"/>
  <circle cx="50" cy="50" r="6" fill="white"/>
  <circle cx="65" cy="50" r="4" fill="white" opacity="0.9"/>
  <circle cx="30" cy="65" r="4" fill="white" opacity="0.9"/>
  <circle cx="50" cy="70" r="4" fill="white" opacity="0.9"/>
  <circle cx="70" cy="65" r="4" fill="white" opacity="0.9"/>
  
  <!-- Connection lines -->
  <line x1="30" y1="35" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="30" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="35" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="50" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="50" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="65" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="70" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="65" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
</svg>
